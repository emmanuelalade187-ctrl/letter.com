<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Sweet Message for My Parent</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

                <link rel="stylesheet" href="parent.css">
    <div class="background"></div>

    <!-- Floating hearts -->
    <div class="hearts">
        <span>💖</span>
        <span>💕</span>
        <span>💗</span>
        <span>💝</span>
        <span>❤️</span>
        <span>💓</span>
        <span>💞</span>
    </div>

               <link rel="stylesheet" href="parent.js">
    <main class="card">

        <div class="flower">🌸</div>

        <p class="small-title">A MESSAGE FROM MY HEART</p>

        <h1>
            Dear <span>Mom & Dad</span> ❤️
        </h1>

        <!-- Text will be written here -->
        <p class="message">
            <span id="typing-text"></span>
            <span class="cursor"></span>
        </p>

        <div class="signature">
            With all my love ❤️
            <br>
            <span>— Emmanuel</span>
        </div>

        <button onclick="restartMessage()">
            Read Again 💌
        </button>

    </main>

    <script src="parent.js"></script>

</body>
</html>
